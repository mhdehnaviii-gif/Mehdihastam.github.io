<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حمایت مالی از موزیک گیت گیت</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: white;
      font-family: "Vazirmatn", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: #111;
      border: 1px solid #ff7a00;
      border-radius: 24px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 122, 0, 0.15);
    }

    h1 {
      color: #ff7a00;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .text {
      font-family: "Noto Nastaliq Urdu", serif;
      font-size: 23px;
      line-height: 2.4;
      color: #f5f5f5;
      margin-bottom: 30px;
    }

    .name {
      color: #ff7a00;
      font-family: "Noto Nastaliq Urdu", serif;
      font-size: 22px;
    }

    .button {
      display: inline-block;
      background: #ff7a00;
      color: #111;
      text-decoration: none;
      font-weight: 900;
      padding: 14px 30px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.04);
      background: #ff922e;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🧡 حمایت مالی از موزیک گیت گیت</h1>

    <div class="text">
      حمایت شما دلگرمی ما برای ساخت موزیک های آینده‌ست.
    </div>

    <div class="name">
      سپاس، مهدی.
    </div>

    <br><br>

    <!-- لینک پرداخت را اینجا قرار بده -->
    <a class="button" href="#" target="_blank">
      حمایت مالی 🧡
    </a>

  </div>

</body>
</html>
