<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>به زودی</title>

  <!-- فونت نستعلیق -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0508;
      position: relative;
    }

    /* لایه‌های نورانی و چرخان */

    body::before {
      content: "";
      position: absolute;

      width: 130vw;
      height: 130vw;

      background:
        conic-gradient(
          from 0deg,
          #ff5a00,
          #ff1493,
          #ff7a00,
          #ff2d95,
          #ff8c00,
          #ff1493,
          #ff5a00
        );

      border-radius: 50%;

      filter: blur(70px);

      opacity: 0.75;

      animation:
        rotateBackground 18s linear infinite;
    }

    body::after {
      content: "";
      position: absolute;

      width: 90vw;
      height: 90vw;

      background:
        conic-gradient(
          from 180deg,
          #ff1493,
          #ff7a00,
          #ff4f9a,
          #ff9500,
          #ff1493
        );

      border-radius: 50%;

      filter: blur(55px);

      opacity: 0.55;

      animation:
        rotateBackgroundReverse 12s linear infinite;
    }

    /* دایره‌های نور */

    .light {
      position: absolute;

      width: 45vw;
      height: 45vw;

      border-radius: 50%;

      filter: blur(80px);

      opacity: 0.5;

      animation:
        floating 7s ease-in-out infinite alternate;
    }

    .light.one {
      background: #ff5a00;
      top: -20%;
      left: -15%;
    }

    .light.two {
      background: #ff1493;
      bottom: -20%;
      right: -15%;

      animation-delay: -3s;
    }

    /* لایه شیشه‌ای */

    .overlay {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle,
          transparent 0%,
          rgba(0, 0, 0, 0.25) 50%,
          rgba(0, 0, 0, 0.65) 100%
        );

      z-index: 2;
    }

    /* نوشته */

    .soon {
      position: relative;

      z-index: 5;

      color: white;

      font-family:
        "Noto Nastaliq Urdu",
        serif;

      font-size: clamp(60px, 13vw, 150px);

      font-weight: 400;

      text-align: center;

      text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 30px #ff1493,
        0 0 60px #ff5a00,
        5px 8px 0 rgba(0,0,0,0.25);

      animation:
        textGlow 3s ease-in-out infinite alternate,
        textFloat 4s ease-in-out infinite;
    }

    /* چرخش پس‌زمینه */

    @keyframes rotateBackground {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes rotateBackgroundReverse {
      from {
        transform: rotate(360deg) scale(1);
      }

      to {
        transform: rotate(0deg) scale(1);
      }
    }

    /* حرکت نور */

    @keyframes floating {
      0% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(12vw, -8vh)
          scale(1.25);
      }

      100% {
        transform:
          translate(-8vw, 10vh)
          scale(0.9);
      }
    }

    /* درخشش متن */

    @keyframes textGlow {
      0% {
        text-shadow:
          0 0 10px rgba(255,255,255,0.7),
          0 0 25px #ff1493,
          0 0 45px #ff5a00;
      }

      100% {
        text-shadow:
          0 0 20px white,
          0 0 45px #ff1493,
          0 0 85px #ff5a00;
      }
    }

    /* حرکت خیلی نرم متن */

    @keyframes textFloat {
      0%,
      100% {
        transform:
          translateY(0)
          rotate(-1deg);
      }

      50% {
        transform:
          translateY(-12px)
          rotate(1deg);
      }
    }

    /* موبایل */

    @media (max-width: 600px) {
      body::before {
        width: 180vw;
        height: 180vw;
      }

      body::after {
        width: 130vw;
        height: 130vw;
      }

      .soon {
        font-size: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="light one"></div>
  <div class="light two"></div>

  <div class="overlay"></div>

  <div class="soon">
    به زودی ..
  </div>

</body>
</html>
